<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Đăng ký thi học viên · Minh Khang</title>

  <!-- Favicon từ file logo.png có sẵn trong kho -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">

  <!-- Thẻ xem trước (Open Graph / Zalo / Facebook) khi gửi link rút gọn -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Đăng ký thi học viên · Minh Khang">
  <meta property="og:description" content="Cổng đăng ký thi tốt nghiệp và sát hạch lái xe - Trung tâm Minh Khang.">
  <meta property="og:image" content="logo.png">
  <meta name="theme-color" content="#007d79">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f2f6f7;
      color: #193944;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
    }
    /* Hộp hỗ trợ mở trực tiếp khi gặp sự cố mạng hoặc trình duyệt chặn iframe */
    details {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      max-width: min(340px, calc(100vw - 24px));
      padding: 8px 12px;
      background: #ffffff;
      border: 1px solid #b9cdd3;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(25, 57, 68, 0.15);
      font-size: 14px;
      line-height: 1.5;
    }
    summary {
      cursor: pointer;
      color: #007d79;
      font-weight: 600;
      user-select: none;
    }
    summary:hover {
      color: #005653;
    }
    p {
      margin: 8px 0 4px;
    }
    a.btn-direct {
      display: inline-block;
      margin-top: 6px;
      padding: 6px 12px;
      background-color: #007d79;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      font-size: 13px;
    }
    a.btn-direct:hover {
      background-color: #005653;
    }
  </style>
</head>
<body>
  <!-- Nhúng toàn màn hình ứng dụng Google Apps Script -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbxO_7-jgh3GaZxJ8g5CBmgV_LibNMhZV8WfJAQ3OCWRwUl3FepgsIsSZyuI8J8roFTJ/exec"
    title="Đăng ký thi học viên · Minh Khang"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen">
  </iframe>

  <!-- Hộp trợ giúp dự phòng -->
  <details>
    <summary>Không mở được trang?</summary>
    <p>Nếu trang không hiển thị, vui lòng bấm vào nút bên dưới để mở trực tiếp:</p>
    <a class="btn-direct" href="https://script.google.com/macros/s/AKfycbxO_7-jgh3GaZxJ8g5CBmgV_LibNMhZV8WfJAQ3OCWRwUl3FepgsIsSZyuI8J8roFTJ/exec" target="_blank" rel="noopener noreferrer">Mở trang đăng ký ↗</a>
  </details>
</body>
</html>
